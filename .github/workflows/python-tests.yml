name: Backend regression tests

on:
  push:
    branches: [main, engineering-sprint-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install minimal backend test dependencies
        run: python -m pip install --upgrade pip flask flask-cors python-dotenv requests pytest schedule
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Check frontend JavaScript syntax
        run: node --check script.js
      - name: Run frontend end-to-end tests
        run: npx playwright test
      - name: Compile Python modules
        run: python -m compileall -q app.py analysis_engine.py evidence_engine.py verification_engine.py verdict_policy.py shareable_report.py claim_monitor.py monitor_worker.py context_memory.py incremental_verification.py ocr_support.py notification_store.py benchmark_followups.py transparency_dashboard.py revalidation_worker.py
      - name: Run pytest regression suite
        env:
          FLASK_DEBUG: "false"
          MAX_REQUESTS_PER_HOUR: "1000"
        run: python -m pytest -q
      - name: Run unittest regression suite
        env:
          FLASK_DEBUG: "false"
          MAX_REQUESTS_PER_HOUR: "1000"
        run: python -m unittest discover -s tests -v
