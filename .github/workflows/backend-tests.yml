name: Backend tests and security checks

on:
  push:
    branches: [main, engineering-sprint-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install core dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Run regression suite
        env:
          FLASK_DEBUG: 'false'
          ALLOWED_ORIGINS: http://localhost:8080
        run: python -m pytest -q
      - name: Compile Python modules
        run: python -m compileall -q .
